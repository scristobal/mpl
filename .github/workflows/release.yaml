name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

# Make sure release jobs are only ever run once at a time (and are never
# cancelled when new jobs for the same group are queued).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check versions
        run: |
          set -euo pipefail

          export RELEASE_VERSION="${GITHUB_REF#refs/*/v}"
          export CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r .packages[0].version)"
          export CODEMIRROR_VERSION="$(jq -r .version packages/mpl-codemirror/package.json)"
          if [ "$CRATE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch! Release is at $RELEASE_VERSION, crate is at $CRATE_VERSION"
            exit 1
          elif [ "$CODEMIRROR_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch! Release is at $RELEASE_VERSION, mpl-codemirror is at $CRATE_VERSION"
            exit 1
          fi
          export VSCODE_VERSION="$(jq -r .version packages/vscode-mpl/package.json)"
          if [ "$VSCODE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch! Release is at $RELEASE_VERSION, mpl-vscode is at $VSCODE_VERSION"
            exit 1
          fi
          export TREE_SITTER_VERSION="$(jq -r .version packages/tree-sitter-mpl/package.json)"
          if [ "$TREE_SITTER_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch! Release is at $RELEASE_VERSION, tree-sitter-mpl is at $TREE_SITTER_VERSION"
            exit 1
          fi
  publish-npm:
    runs-on: ubuntu-latest
    needs: [check-versions]
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/mpl-codemirror/package-lock.json
          registry-url: https://registry.npmjs.org
          scope: "@axiomhq"
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build WASM
        run: ./packages/build-mpl-wasm.sh
      - name: Update mpl package.json
        run: |
          set -euo pipefail

          jq '
            .name = "@axiomhq/mpl"
            | .files = ["mpl.js", "mpl.d.ts", "mpl_bg.wasm", "mpl_bg.wasm.d.ts", "LICENSE-MIT", "LICENSE-APACHE"]
            | .repository.url = "git+https://github.com/axiomhq/mpl.git"
          ' packages/mpl/package.json > packages/mpl/package.json.tmp
          mv packages/mpl/package.json.tmp packages/mpl/package.json
      - name: Type-check WASM bindings
        working-directory: packages/mpl
        run: |
          npm install --no-save typescript
          npx tsc --noEmit -t esnext mpl.d.ts
      - name: Build mpl-codemirror
        working-directory: packages/mpl-codemirror
        run: npm install && npm run build
      - name: Build tree-sitter-mpl
        working-directory: packages/tree-sitter-mpl
        run: npm install && npm run build
      - name: Publish mpl to npmjs.org
        working-directory: packages/mpl
        run: npm publish --access public
      - name: Publish mpl-codemirror to npmjs.org
        working-directory: packages/mpl-codemirror
        run: npm publish --access public
      - name: Publish tree-sitter-mpl to npmjs.org
        working-directory: packages/tree-sitter-mpl
        run: npm publish --access public
  publish-crates-io:
    runs-on: ubuntu-latest
    needs: [check-versions]
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  package-vscode:
    name: package VS Code (${{ matrix.vscode-target }})
    needs: [check-versions]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode-target: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/mpl-language-server
          - os: ubuntu-24.04-arm
            vscode-target: linux-arm64
            rust-target: aarch64-unknown-linux-gnu
            binary: target/aarch64-unknown-linux-gnu/release/mpl-language-server
          - os: macos-13
            vscode-target: darwin-x64
            rust-target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/mpl-language-server
          - os: macos-14
            vscode-target: darwin-arm64
            rust-target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/mpl-language-server
          - os: windows-2022
            vscode-target: win32-x64
            rust-target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/mpl-language-server.exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust-target }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build language server
        run: cargo build --release -p mpl-language-server --features lsp-bin --target "${{ matrix.rust-target }}"
        shell: bash
      - name: Build extension
        run: npm run build:vscode
      - name: Stage language server
        run: npm run stage:server -w mpl-vscode
        shell: bash
        env:
          MPL_SERVER_BIN: ${{ matrix.binary }}
      - name: Package VSIX
        working-directory: packages/vscode-mpl
        run: npx vsce package --target "${{ matrix.vscode-target }}" --no-dependencies
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: mpl-vscode-${{ matrix.vscode-target }}
          path: packages/vscode-mpl/*.vsix
          if-no-files-found: error
  publish-vscode:
    runs-on: ubuntu-latest
    needs: [package-vscode]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install -g @vscode/vsce
      - uses: actions/download-artifact@v4
        with:
          path: vscode-vsix
          pattern: mpl-vscode-*
          merge-multiple: true
      - name: Publish VS Code extension
        run: |
          set -euo pipefail
          for package in vscode-vsix/*.vsix; do
            vsce publish --packagePath "$package"
          done
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
