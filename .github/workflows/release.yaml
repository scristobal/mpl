name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

# Make sure release jobs are only ever run once at a time (and are never
# cancelled when new jobs for the same group are queued).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check versions
        run: |
          set -euo pipefail

          export RELEASE_VERSION="${GITHUB_REF#refs/*/v}"
          export CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r .packages[0].version)"
          export CODEMIRROR_VERSION="$(jq -r .version packages/mpl-codemirror/package.json)"
          if [ "$CRATE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch! Release is at $RELEASE_VERSION, crate is at $CRATE_VERSION"
            exit 1
          elif [ "$CODEMIRROR_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch! Release is at $RELEASE_VERSION, mpl-codemirror is at $CRATE_VERSION"
            exit 1
          fi
          export VSCODE_VERSION="$(jq -r .version packages/mpl-vscode/package.json)"
          if [ "$VSCODE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch! Release is at $RELEASE_VERSION, mpl-vscode is at $VSCODE_VERSION"
            exit 1
          fi
  publish-npm:
    runs-on: ubuntu-latest
    needs: [check-versions]
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/mpl-codemirror/package-lock.json
          registry-url: https://registry.npmjs.org
          scope: "@axiomhq"
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build WASM
        run: ./packages/build-mpl-wasm.sh
      - name: Update mpl package.json
        run: |
          set -euo pipefail

          jq '
            .name = "@axiomhq/mpl"
            | .files = ["mpl.js", "mpl.d.ts", "mpl_bg.wasm", "mpl_bg.wasm.d.ts", "LICENSE-MIT", "LICENSE-APACHE"]
            | .repository.url = "git+https://github.com/axiomhq/mpl.git"
          ' packages/mpl/package.json > packages/mpl/package.json.tmp
          mv packages/mpl/package.json.tmp packages/mpl/package.json
      - name: Type-check WASM bindings
        working-directory: packages/mpl
        run: |
          npm install --no-save typescript
          npx tsc --noEmit -t esnext mpl.d.ts
      - name: Build mpl-codemirror
        working-directory: packages/mpl-codemirror
        run: npm install && npm run build
      - name: Publish mpl to npmjs.org
        working-directory: packages/mpl
        run: npm publish --access public
      - name: Publish mpl-codemirror to npmjs.org
        working-directory: packages/mpl-codemirror
        run: npm publish --access public
  publish-crates-io:
    runs-on: ubuntu-latest
    needs: [check-versions]
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  package-vscode:
    name: package VS Code (${{ matrix.vscode-target }})
    needs: [check-versions]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode-target: linux-x64
            asset-target: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/mpl-lsp
          - os: ubuntu-24.04-arm
            vscode-target: linux-arm64
            asset-target: linux-arm64
            rust-target: aarch64-unknown-linux-gnu
            binary: target/aarch64-unknown-linux-gnu/release/mpl-lsp
          - os: macos-15-intel
            vscode-target: darwin-x64
            asset-target: macos-x64
            rust-target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/mpl-lsp
          - os: macos-14
            vscode-target: darwin-arm64
            asset-target: macos-arm64
            rust-target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/mpl-lsp
          - os: windows-2022
            vscode-target: win32-x64
            asset-target: win32-x64
            rust-target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/mpl-lsp.exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust-target }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build language server
        run: cargo build --release -p mpl-language-server --features lsp-bin --target "${{ matrix.rust-target }}"
        shell: bash
      - name: Type-check extension
        run: npm run check -w mpl-vscode
      - name: Build extension
        run: npm run build -w mpl-vscode
      - name: Stage language server
        run: npm run stage -w mpl-vscode -- "${{ github.workspace }}/${{ matrix.binary }}"
        shell: bash
      - name: Package VSIX
        working-directory: packages/mpl-vscode
        run: npx vsce package --target "${{ matrix.vscode-target }}" --no-dependencies
        shell: bash
      - name: Rename VSIX asset
        working-directory: packages/mpl-vscode
        run: |
          set -euo pipefail

          vscode_target="${{ matrix.vscode-target }}"
          asset_target="${{ matrix.asset-target }}"

          if [ "$vscode_target" = "$asset_target" ]; then
            exit 0
          fi

          for package in mpl-vscode-"$vscode_target"-*.vsix; do
            mv "$package" "${package/$vscode_target/$asset_target}"
          done
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: mpl-vscode-${{ matrix.asset-target }}
          path: packages/mpl-vscode/*.vsix
          if-no-files-found: error
  upload-vscode-release:
    name: upload VS Code VSIXes to GitHub Release
    runs-on: ubuntu-latest
    needs: [package-vscode]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: vscode-vsix
          pattern: mpl-vscode-*
          merge-multiple: true
      - name: Create GitHub Release
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME"; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload VSIX files to GitHub Release
        run: gh release upload "$GITHUB_REF_NAME" vscode-vsix/*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
